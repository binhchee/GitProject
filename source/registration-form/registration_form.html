<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký người dùng</title><style>:root{font-family:"Segoe UI",sans-serif;color:#243b37;background:#eef3ef}*{box-sizing:border-box}body{margin:0;padding:40px 18px}.form-shell{width:min(100%,500px);margin:auto;padding:28px;background:#fff;border-top:4px solid #287461}h1{margin:0 0 8px;color:#174f46;font-size:27px}.intro{margin:0 0 24px;color:#5c6d66;font-size:13px;line-height:1.6}.field{margin:16px 0}label,legend{display:block;margin-bottom:7px;font-size:13px;font-weight:700}input[type=text],input[type=email],input[type=tel]{width:100%;min-height:44px;padding:10px 12px;border:1px solid #aebdb4;font:inherit}fieldset{margin:18px 0 22px;padding:12px;border:1px solid #ced9d1}fieldset label{display:inline-flex;align-items:center;gap:6px;margin:4px 15px 4px 0;font-weight:400}button{width:100%;min-height:46px;border:0;color:#fff;background:#287461;font:inherit;font-weight:700}.notice{margin:13px 0 0;color:#66756e;font-size:11px;line-height:1.5}</style></head>
<body><main class="form-shell"><h1>Đăng ký người dùng</h1><p class="intro">Điền thông tin liên hệ và chọn giới tính để hoàn tất biểu mẫu.</p><form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST"><div class="field"><label for="name">Họ và tên</label><input id="name" name="name" type="text" autocomplete="name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div><fieldset><legend>Giới tính</legend><label><input type="radio" name="gender" value="male" required> Nam</label><label><input type="radio" name="gender" value="female"> Nữ</label><label><input type="radio" name="gender" value="other"> Khác</label></fieldset><button type="submit">Gửi đăng ký</button></form><p class="notice">Biểu mẫu minh họa gửi bằng POST tới máy chủ thử nghiệm của bài học.</p></main></body></html>
