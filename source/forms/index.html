<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biểu mẫu HTML</title><style>:root{font-family:Tahoma,sans-serif;color:#233b36;background:#f1f4ef}*{box-sizing:border-box}body{margin:0;padding:32px 18px}main{width:min(100%,760px);margin:auto}h1,h2{color:#174f46}section{margin:0 0 28px;padding:24px;border:1px solid #cbd8d0;background:#fff}fieldset{margin:16px 0;padding:14px;border:1px solid #d4ded7}legend{padding:0 6px;color:#174f46;font-weight:700}.field{margin:12px 0}label{display:inline-block;margin-bottom:5px;font-size:14px;font-weight:600}input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;min-height:42px;padding:9px 10px;border:1px solid #9eafa5;font:inherit}textarea{min-height:82px}.choices label{margin:4px 14px 4px 0;font-weight:400}button{min-height:42px;padding:9px 15px;border:0;background:#174f46;color:#fff;font:inherit;font-weight:700}button[type=reset]{margin-left:8px;background:#fff;color:#174f46;border:1px solid #174f46}@media(max-width:520px){body{padding:18px 12px}section{padding:17px}}</style></head><body><main><h1>Biểu mẫu HTML</h1>
<section><h2>Form sở thích</h2><form action="#" method="get"><div class="field"><label for="yourname">Họ và tên</label><input id="yourname" name="yourname" type="text" required></div><div class="field"><label for="emailSimple">Email</label><input id="emailSimple" name="email" type="email" required></div><fieldset class="choices"><legend>Sở thích</legend><label><input type="checkbox" name="hobby" value="coding"> Lập trình</label><label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label><label><input type="checkbox" name="hobby" value="travel"> Du lịch</label></fieldset><button type="submit">Gửi thông tin</button><button type="reset">Nhập lại</button></form></section>
<section><h2>Đăng ký học viên</h2><form action="#" method="get"><div class="field"><label for="fullname">Họ và tên</label><input id="fullname" name="fullname" type="text" required></div><div class="field"><label for="studentEmail">Email</label><input id="studentEmail" name="email" type="email" required></div><div class="field"><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel"></div><div class="field"><label for="birthday">Ngày sinh</label><input id="birthday" name="birthday" type="date"></div><fieldset class="choices"><legend>Giới tính</legend><label><input type="radio" name="gender" value="male"> Nam</label><label><input type="radio" name="gender" value="female"> Nữ</label><label><input type="radio" name="gender" value="other"> Khác</label></fieldset><div class="field"><label for="address">Địa chỉ</label><textarea id="address" name="address"></textarea></div><div class="field"><label for="course">Khóa học</label><select id="course" name="course"><option>HTML &amp; CSS</option><option>JavaScript</option><option>Java</option><option>Python</option></select></div><fieldset class="choices"><legend>Hình thức học</legend><label><input type="radio" name="study_type" value="online"> Online</label><label><input type="radio" name="study_type" value="offline"> Offline</label></fieldset><fieldset class="choices"><legend>Sở thích</legend><label><input type="checkbox" name="hobby" value="coding"> Lập trình</label><label><input type="checkbox" name="hobby" value="design"> Thiết kế</label><label><input type="checkbox" name="hobby" value="technology"> Công nghệ</label></fieldset><div class="field"><label for="note">Ghi chú</label><textarea id="note" name="note"></textarea></div><button type="submit">Đăng ký</button><button type="reset">Nhập lại</button></form></section></main></body></html>
