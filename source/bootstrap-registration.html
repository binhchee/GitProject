<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo tài khoản | Fieldnotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: #eef2ef; color: #22332e; }
    .form-shell { width: min(100% - 28px, 680px); margin: 48px auto; padding: 32px; border: 1px solid #d8e1dc; border-radius: 6px; background: #fff; }
    .form-title { color: #174d43; }
    .form-check-input:checked { background-color: #286c5b; border-color: #286c5b; }
    .btn-forest { background: #174d43; border-color: #174d43; color: #fff; }
    .btn-forest:hover { background: #103b33; border-color: #103b33; color: #fff; }
    @media (max-width: 575.98px) { .form-shell { margin: 18px auto; padding: 22px 18px; } }
  </style>
</head>
<body>
  <main class="form-shell">
    <p class="text-uppercase small fw-semibold text-success mb-2">Fieldnotes</p>
    <h1 class="form-title h2 fw-bold">Tạo tài khoản</h1>
    <p class="text-muted mb-4">Đăng ký để nhận những câu chuyện và gợi ý mới.</p>

    <form action="#" method="get">
      <div class="mb-3">
        <label for="fullName" class="form-label">Họ và tên</label>
        <input class="form-control" id="fullName" name="fullName" type="text" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="password" class="form-label">Mật khẩu</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
          <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
      </div>

      <fieldset class="mb-3">
        <legend class="form-label fs-6">Giới tính</legend>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female"><label class="form-check-label" for="genderFemale">Nữ</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="genderMale" value="male"><label class="form-check-label" for="genderMale">Nam</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="genderOther" value="other"><label class="form-check-label" for="genderOther">Khác</label></div>
        </div>
      </fieldset>

      <fieldset class="mb-3">
        <legend class="form-label fs-6">Sở thích</legend>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check"><input class="form-check-input" type="checkbox" name="interests" id="interestDesign" value="design"><label class="form-check-label" for="interestDesign">Thiết kế</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="interests" id="interestTechnology" value="technology"><label class="form-check-label" for="interestTechnology">Công nghệ</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" name="interests" id="interestCulture" value="culture"><label class="form-check-label" for="interestCulture">Văn hóa</label></div>
        </div>
      </fieldset>

      <div class="mb-4">
        <label for="country" class="form-label">Quốc gia</label>
        <select class="form-select" id="country" name="country" required>
          <option value="" selected disabled>Chọn quốc gia</option>
          <option value="vn">Việt Nam</option>
          <option value="sg">Singapore</option>
          <option value="jp">Nhật Bản</option>
          <option value="other">Khác</option>
        </select>
      </div>

      <button class="btn btn-forest w-100" type="submit">Tạo tài khoản</button>
      <p class="text-center text-muted small mt-3 mb-0">Bằng việc đăng ký, bạn đồng ý với điều khoản sử dụng.</p>
    </form>
  </main>
</body>
</html>
